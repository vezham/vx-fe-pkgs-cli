# @vx/INFO: @vx/ci
name: QA

on:
  schedule:
    - cron: '30 22 * * 2,5' # every Wed, Sat at 04:00 AM IST
  workflow_dispatch:
  push:
    branches: [timeline, feat/*]
    # paths:
    #   - '.github/workflows/qa.yml'
    #   - 'vx/handbooks/ci.md'
    #   - 'packages/**'

run-name: >
  ${{ github.event_name == 'schedule' && 'ci(TVA): QA' ||
      github.event_name == 'workflow_dispatch' && 'ci(TVA): QA - Trails' ||
      github.event.head_commit.message ||
      github.event.workflow_run.head_commit.message ||
      github.ref_name }} 
  - by @${{ github.actor || 'vx/ci' }}

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  # timeout-minutes: 10

permissions:
  checks: write
  contents: write
  pull-requests: write

env:
  REPO: ${{ github.repository }}
  BRANCH: ${{ github.ref_name }}
  ACTOR: ${{ github.actor || 'vx/ci' }}
  NX_NO_CLOUD: true
  VX_NAME: '@vx/fe-kit'
  VX_SKIP: '@vx/fe-kit'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: action | 🧰 Checkout | ${{ env.REPO }}@${{ env.BRANCH }}
        uses: vezham/vx-fe-deployer/.github/actions/common/setup-checkout@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          GIT_BRANCH: ${{ env.BRANCH }}

      - name: action | 🧩 Setup Node & pnpm
        uses: vezham/vx-fe-deployer/.github/actions/common/setup-install@timeline

      - name: fork | 🏗️ Build
        # id: build
        # continue-on-error: false
        shell: bash
        run: |
          pnpm nx run-many -t build || { echo "❌ Build failed"; exit 1; }

      - name: action | nx/AI fix
        if: always()
        uses: vezham/vx-fe-deployer/.github/actions/nx/ai-fix@timeline

  types:
    runs-on: ubuntu-latest

    steps:
      - name: action | 🧰 Checkout | ${{ env.REPO }}@${{ env.BRANCH }}
        uses: vezham/vx-fe-deployer/.github/actions/common/setup-checkout@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          GIT_BRANCH: ${{ env.BRANCH }}

      - name: action | 🧩 Setup Node & pnpm
        uses: vezham/vx-fe-deployer/.github/actions/common/setup-install@timeline

      - name: fork | 🧠 Typecheck
        shell: bash
        run: |
          pnpm nx run-many -t typecheck

      - name: action | nx/AI fix
        if: always()
        uses: vezham/vx-fe-deployer/.github/actions/nx/ai-fix@timeline

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: action | 🧰 Checkout | ${{ env.REPO }}@${{ env.BRANCH }}
        uses: vezham/vx-fe-deployer/.github/actions/common/setup-checkout@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          GIT_BRANCH: ${{ env.BRANCH }}

      - name: action | 🧩 Setup Node & pnpm
        uses: vezham/vx-fe-deployer/.github/actions/common/setup-install@timeline

      - name: fork | 🧹 Lint - ESLint
        shell: bash
        run: |
          pnpm nx run-many -t lint

      - name: action | nx/AI fix
        if: always()
        uses: vezham/vx-fe-deployer/.github/actions/nx/ai-fix@timeline

  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: action | 🧰 Checkout | ${{ env.REPO }}@${{ env.BRANCH }}
        uses: vezham/vx-fe-deployer/.github/actions/common/setup-checkout@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          GIT_BRANCH: ${{ env.BRANCH }}

      - name: action | 🧩 Setup Node & pnpm
        uses: vezham/vx-fe-deployer/.github/actions/common/setup-install@timeline

      - name: fork | 🎨 Format - Prettier
        shell: bash
        run: |
          pnpm nx run @vx:@vx-ci/format-check

      - name: action | nx/AI fix
        if: always()
        uses: vezham/vx-fe-deployer/.github/actions/nx/ai-fix@timeline

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: action | 🧰 Checkout | ${{ env.REPO }}@${{ env.BRANCH }}
        uses: vezham/vx-fe-deployer/.github/actions/common/setup-checkout@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          GIT_BRANCH: ${{ env.BRANCH }}

      - name: action | 🧩 Setup Node & pnpm
        uses: vezham/vx-fe-deployer/.github/actions/common/setup-install@timeline

      - name: fork | 🧪 Test - Vitest
        shell: bash
        run: |
          pnpm nx run-many -t test --passWithNoTests --exclude=${{ env.VX_SKIP }}

      - name: action | nx/AI fix
        if: always()
        uses: vezham/vx-fe-deployer/.github/actions/nx/ai-fix@timeline

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: action | 🧰 Checkout | ${{ env.REPO }}@${{ env.BRANCH }}
        uses: vezham/vx-fe-deployer/.github/actions/common/setup-checkout@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          GIT_BRANCH: ${{ env.BRANCH }}

      - name: action | 🧩 Setup Node & pnpm
        uses: vezham/vx-fe-deployer/.github/actions/common/setup-install@timeline

      - name: fork | 🎭 E2E - Playwright
        shell: bash
        run: |
          npx playwright install --with-deps
          pnpm nx run-many -t e2e

      - name: action | nx/AI fix
        if: always()
        uses: vezham/vx-fe-deployer/.github/actions/nx/ai-fix@timeline

  summary:
    if: always()
    needs: [build, types, lint, prettier, tests, e2e]
    runs-on: ubuntu-latest

    steps:
      - name: action | 🧾 Run QA Summary
        uses: vezham/vx-fe-deployer/.github/actions/common/qa-summary@timeline
        with:
          actor: ${{ env.ACTOR }}
          token: ${{ secrets.GITHUB_TOKEN }}
          build_result: ${{ needs.build.result }}
          types_result: ${{ needs.types.result }}
          lint_result: ${{ needs.lint.result }}
          prettier_result: ${{ needs.prettier.result }}
          tests_result: ${{ needs.tests.result }}
          e2e_result: ${{ needs.e2e.result }}
